name: Build and Deploy to CloudHub 2.0 via CLI

on:
  push:
    branches:
      - master

env:
  APP_NAME: order-api
  TARGET: cloudhub-us-east-2
  ENVIRONMENT: Sandbox
  ORG_NAME: Hellsing

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java and Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Mule application
        run: mvn clean package -DskipTests

      - name: Install Anypoint CLI
        run: npm install -g anypoint-cli-v4

      - name: Login to Anypoint CLI
        run: |
          anypoint-cli-v4 config set username $ANYPOINT_USERNAME
          anypoint-cli-v4 config set password $ANYPOINT_PASSWORD
          anypoint-cli-v4 config set environment "${ENVIRONMENT}"
          anypoint-cli-v4 config set organization "${ORG_NAME}"
          anypoint-cli-v4 login
        env:
          ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
          ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}

      - name: Deploy to CloudHub 2.0
        run: |
          JAR_FILE=$(ls target/*.jar | head -n1)
          echo "Deploying: $JAR_FILE"
          anypoint-cli-v4 runtime-mgr cloudhub2 deploy \
            --target "${TARGET}" \
            --environment "${ENVIRONMENT}" \
            --organization "${ORG_NAME}" \
            --name "${APP_NAME}" \
            --file "$JAR_FILE" --overwrite
