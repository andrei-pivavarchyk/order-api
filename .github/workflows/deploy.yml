name: Build & Deploy to CloudHub 2.0

on:
  push:
    branches:
      - main

env:
  ORG_ID: dd5302b1-b873-4250-b3ba-cff448dafdab
  ENV_ID: 869d18a5-39b8-4d21-8886-f2b8abea82c3
  DEPLOYMENT_TARGET_ID: 7e1948b7-68a0-4a5d-a561-95d620c41f7e
  APP_NAME: order-api
  VERSION: v1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java and Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Mule application
        run: mvn clean package -DskipTests

      - name: Create GitHub Release (if not exists)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.jar
          tag_name: ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get OAuth token
        id: auth
        run: |
          TOKEN=$(curl -s -X POST https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${{ secrets.ANYPOINT_CLIENT_ID }}&client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }}" | jq -r .access_token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to CloudHub 2.0
        run: |
          curl -X POST https://anypoint.mulesoft.com/runtimefabric/api/organizations/${ORG_ID}/environments/${ENV_ID}/deployments \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d '{
            "targetId": "'${DEPLOYMENT_TARGET_ID}'",
            "name": "'${APP_NAME}'",
            "artifact": {
              "type": "mule",
              "uri": "https://github.com/'${{ github.repository }}'/releases/download/'${{ env.VERSION }}'/order-api-1.0.0.jar"
            },
            "replicas": 1,
            "desiredState": "STAR TED"
          }'
