name: Deploy to CloudHub 2.0

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '8'

      - name: Build project
        run: mvn clean package

      - name: Install Anypoint CLI v4
        run: npm install -g anypoint-cli-v4

      - name: Authenticate to Anypoint
        run: |
          anypoint-cli-v4 auth:login \
            --client-id "${{ secrets.ANYPOINT_CLIENT_ID }}" \
            --client-secret "${{ secrets.ANYPOINT_CLIENT_SECRET }}" \
            --json > token.json

      - name: Deploy to CloudHub 2.0
        run: |
          anypoint-cli-v4 runtime-mgr cloudhub2:deploy \
            --org "${{ secrets.ANYPOINT_ORG }}" \
            --env "${{ secrets.ANYPOINT_ENV }}" \
            --target "Shared Space US East (Ohio)" \
            --app-name "system-order-api" \
            --file target/system-order-api-1.0.0-SNAPSHOT-mule-application.jar
